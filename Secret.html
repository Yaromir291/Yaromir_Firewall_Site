<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaromir Firewall — секретная зона</title>
    <link rel="icon" href="images/icon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🔒 Секретная зона</h1>
    <p>Введите пароль, чтобы получить доступ:</p>

    <input type="password" id="passwordInput" placeholder="Пароль">
    <button id="checkButton">Проверить</button>

    <p id="resultMessage"></p>

    <div id="secretContent" style="display:none;">
        <h2>🎉 Доступ разрешён!</h2>
        <p>Файл скачивается автоматически...</p>
        <p id="downloadInfo"></p>
    </div>

    <script>
        // ===== НАСТРОЙКИ =====
        // SHA-256 хэш правильного пароля
        const CORRECT_HASH = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8";

        // Путь к файлу, который скачается после правильного пароля
        // Замени на свой файл (например: "files/secret.zip" или "images/секрет.png")
        const SECRET_FILE = "files/secret.zip";

        // Имя файла при скачивании (можно оставить пустым — возьмётся из пути)
        const DOWNLOAD_NAME = "Yaromir_Secret.zip";

        // ===== ОБРАБОТКА =====
        async function sha256(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        document.getElementById("checkButton").addEventListener("click", async () => {
            const input = document.getElementById("passwordInput").value;
            const resultMsg = document.getElementById("resultMessage");
            const secret = document.getElementById("secretContent");
            const downloadInfo = document.getElementById("downloadInfo");

            if (!input) {
                resultMsg.textContent = "Введите пароль!";
                resultMsg.style.color = "red";
                return;
            }

            const hash = await sha256(input);

            if (hash === CORRECT_HASH) {
                resultMsg.textContent = "";
                secret.style.display = "block";
                document.getElementById("passwordInput").style.display = "none";
                document.getElementById("checkButton").style.display = "none";

                // ===== АВТОСКАЧИВАНИЕ ФАЙЛА =====
                try {
                    // Проверяем, существует ли файл
                    const response = await fetch(SECRET_FILE, { method: "HEAD" });

                    if (!response.ok) {
                        downloadInfo.textContent = "⚠️ Файл не найден на сервере.";
                        downloadInfo.style.color = "orange";
                        return;
                    }

                    // Создаём невидимую ссылку и кликаем по ней
                    const link = document.createElement("a");
                    link.href = SECRET_FILE;
                    link.download = DOWNLOAD_NAME || SECRET_FILE.split("/").pop();
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    downloadInfo.textContent = "✅ Файл скачивается: " + (DOWNLOAD_NAME || SECRET_FILE);
                    downloadInfo.style.color = "green";
                } catch (err) {
                    downloadInfo.textContent = "⚠️ Ошибка скачивания: " + err.message;
                    downloadInfo.style.color = "orange";
                }
            } else {
                resultMsg.textContent = "Неверный пароль";
                resultMsg.style.color = "red";
                secret.style.display = "none";
            }
        });

        // Проверка по Enter
        document.getElementById("passwordInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") document.getElementById("checkButton").click();
        });
    </script>
    <p><a href="Index.html">Вернуться на главную</a></p>

    
</body>
</html>
